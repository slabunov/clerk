name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS ARM64
    runs-on: macos-15-arm64
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake qt

      - name: Show toolchain
        run: |
          cmake --version
          clang++ --version
          xcodebuild -version
          brew list --versions qt

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: |
          cmake --build build \
            --config Release \
            --parallel 3
